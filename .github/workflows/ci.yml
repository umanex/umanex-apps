name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type-check, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check, lint, build
        run: pnpm turbo type-check lint build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          # Placeholders, geen secrets: cashflow inlineert deze NEXT_PUBLIC-waardes
          # tijdens de build, dus zonder waarde faalt het prerenderen. CI bouwt een
          # wegwerp-artefact en deployt niet — de echte waardes staan bij Vercel,
          # waar de hard-fail in lib/supabase/client.ts een misconfiguratie blijft
          # tegenhouden.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # De gegenereerde token-output staat in git, maar niets toetste of hij nog
      # matcht met tokens.json. Een PR die tokens.json wijzigt zonder te herbouwen
      # (of omgekeerd) kon dus groen zijn, en de drift kwam pas boven bij de
      # volgende Figma-push. De build hierboven heeft de outputs net herschreven —
      # als er iets verschilt, was de gecommitte versie stale.
      - name: Guard — gegenereerde tokens zijn in sync met tokens.json
        run: |
          if ! git diff --exit-code -- packages/tokens/build; then
            echo "::error::De gecommitte token-output wijkt af van wat de build produceert. Draai 'pnpm --filter @umanex/tokens build' en commit het resultaat."
            exit 1
          fi

      # ESLint ziet de SVG fill=/stroke=-attributen en de .css-bestanden niet, en
      # packages/ui heeft geen eslint-config. Deze guard dekt alles op schijf.
      - name: Guard — laag-discipline (geen primitives of rauwe kleuren in app-code)
        run: pnpm --filter @umanex/tokens guard

      # Toetst de rollaag zelf: elk vlak tegen zijn eigen tekstkleur, en elke vrije
      # tekstrol tegen elk oppervlak waar hij op kan landen. Superset — hij weet niet
      # welke combinaties de apps echt gebruiken, dus een treffer is altijd echt.
      - name: Guard — contrast van de rollaag (WCAG AA)
        run: pnpm --filter @umanex/tokens contrast
