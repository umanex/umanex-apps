name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # De Edge Function draait op Deno, niet op Node, en viel daarmee buiten élke stap hierboven:
  # `turbo type-check` kent hem niet, en zijn `jsr:`-import is voor tsc geen module. Een tikfout
  # in het account-verwijderpad kwam dus pas boven bij de deploy of bij de eerste echte aanroep —
  # en dat pad is onomkeerbaar (AVG art. 17: het wist het account van de aanroeper).
  #
  # Eigen job in plaats van een stap: deze heeft Deno nodig en geen van de dertig andere stappen
  # wil daarop wachten.
  edge-functions:
    name: Edge Functions — deno check (met tegenproef)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # DE TEGENPROEF EERST, en met de reden van het falen erbij. `deno check` op een kapot
      # bestand faalt ook wanneer een import niet oplost of het pad niet bestaat, en dan zou
      # "het faalde dus hij meet" een aanname zijn. De kopie staat daarom NAAST het origineel
      # (identieke resolutie) en de uitvoer moet de type-fout bij zijn code noemen: TS2322,
      # "Type 'string' is not assignable to type 'number'".
      # `set +e` is niet optioneel. GitHub draait elke `run` met `bash -e`, en daaronder breekt
      # `out=$(deno check …)` de shell af op de exit-code van deno — vóór `rc=$?` gelezen wordt.
      # Gemeten in run 34851047836: de stap viel om na 0,23 s, te snel voor een deno die zijn
      # jsr-module nog moet ophalen, en géén van de foutmeldingen hieronder kwam aan bod. Een
      # tegenproef die op zijn eigen succes struikelt, meldt niets over wat hij moest meten.
      - name: Tegenproef — een type-fout hoort deze job rood te maken
        run: |
          set +e
          set -uo pipefail
          F=apps/rowtrack/supabase/functions/delete-account/index.ts
          K=apps/rowtrack/supabase/functions/delete-account/_tegenproef.ts
          [ -f "$F" ] || { echo "::error::$F bestaat niet — de tegenproef heeft geen doel"; exit 1; }
          cp "$F" "$K" || { echo "::error::kopie mislukt"; exit 1; }
          printf '\nconst tegenproef: number = "dit is geen getal";\nconsole.log(tegenproef);\n' >> "$K"
          echo "--- de kopie, laatste regels ---"; tail -3 "$K"
          out=$(deno check --config apps/rowtrack/supabase/functions/deno.json "$K" 2>&1)
          rc=$?
          rm -f "$K"
          echo "--- deno check (exit $rc) ---"
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::deno check accepteerde een type-fout — deze job meet niets"
            exit 1
          fi
          if ! echo "$out" | grep -q 'TS2322'; then
            echo "::error::deno check faalde, maar niet op de type-fout (geen TS2322) — de tegenproef bewijst dan niets"
            exit 1
          fi
          echo "ok — de tegenproef gaat af op de type-fout zelf."

      # `--config` expliciet: deno zoekt zijn deno.json vanaf de WERKMAP, niet vanaf het
      # bestand dat je checkt. Gemeten in run 34854872034: met de config op zijn plek naast de
      # functie, maar zonder deze vlag, bleef hij de monorepo-node_modules gebruiken en gaf
      # exact dezelfde fout als daarvóór.
      - name: deno check op de echte functie
        run: deno check --config apps/rowtrack/supabase/functions/deno.json apps/rowtrack/supabase/functions/delete-account/index.ts

  ci:
    name: Type-check, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check, lint, build
        id: type-check-lint-build
        run: pnpm turbo type-check lint build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          # Placeholders, geen secrets: cashflow inlineert deze NEXT_PUBLIC-waardes
          # tijdens de build, dus zonder waarde faalt het prerenderen. CI bouwt een
          # wegwerp-artefact en deployt niet — de echte waardes staan bij Vercel,
          # waar de hard-fail in lib/supabase/client.ts een misconfiguratie blijft
          # tegenhouden.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # De Storybook van packages/ui EN die van rowtrack draaien hun eigen Vite/PostCSS-keten
      # en zitten dus niet in de build hierboven. `turbo build-storybook` pakt elke package met
      # dat script (nagemeten met `--dry=json`: @umanex/ui en rowtrack), en `outputs` in
      # turbo.json zet `storybook-static/**`, dus ook een cache-hit levert die map af — waar de
      # rowtrack-render-stappen onderaan op leunen. Een story of docs-blok dat niet meer compileert (verwijderde
      # export, verplaatst component, kapotte MDX) zou anders pas opvallen bij de volgende
      # `pnpm storybook` op iemands machine. Eigen stap, zodat de fout in het log bij zijn
      # naam staat en niet ergens in de output van twintig andere builds.
      - name: Build — Storybook (packages/ui + rowtrack)
        id: build-storybook-packages-ui
        run: pnpm turbo build-storybook
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      # Node draait TypeScript zelf (type-stripping), dus dit kost geen testrunner en
      # geen dependency. De bestanden bestonden al maar werden door niets aangeroepen —
      # een test die alleen draait wanneer iemand eraan denkt, meet niets.
      #
      # `git ls-files` in plaats van een glob: shell-globbing verschilt per runner en
      # een patroon dat niets matcht faalt stil op de verkeerde manier. Zo pikt de stap
      # bovendien elk nieuw *.test.ts vanzelf op, zonder deze lijst bij te werken.
      #
      # `--experimental-strip-types` is op Node 22 nodig en op nieuwere versies een
      # geaccepteerde no-op; expliciet meegeven maakt de stap onafhankelijk van welke
      # 22.x de runner toevallig oplevert.
      - name: Guard — invarianten (node:test)
        id: guard-invarianten-node-test
        run: |
          files=$(git ls-files '*.test.ts')
          if [ -z "$files" ]; then
            echo "::error::Geen *.test.ts gevonden. Deze stap hoort iets te draaien; een lege lijst is een fout, geen succes."
            exit 1
          fi
          echo "$files"
          node --experimental-strip-types --test $files

      # De gegenereerde token-output staat in git, maar niets toetste of hij nog
      # matcht met tokens.json. Een PR die tokens.json wijzigt zonder te herbouwen
      # (of omgekeerd) kon dus groen zijn, en de drift kwam pas boven bij de
      # volgende Figma-push. De build hierboven heeft de outputs net herschreven —
      # als er iets verschilt, was de gecommitte versie stale.
      - name: Guard — gegenereerde tokens zijn in sync met tokens.json
        id: guard-gegenereerde-tokens-zijn-in-sync-met-tokens-json
        run: |
          if ! git diff --exit-code -- packages/tokens/build; then
            echo "::error::De gecommitte token-output wijkt af van wat de build produceert. Draai 'pnpm --filter @umanex/tokens build' en commit het resultaat."
            exit 1
          fi

      # ESLint ziet de SVG fill=/stroke=-attributen en de .css-bestanden niet, en
      # packages/ui heeft geen eslint-config. Deze guard dekt alles op schijf.
      - name: Guard — laag-discipline (geen primitives of rauwe kleuren in app-code)
        id: guard-laag-discipline-geen-primitives-of-rauwe-kleuren-in-ap
        run: pnpm --filter @umanex/tokens guard

      # Toetst de rollaag zelf: elk vlak tegen zijn eigen tekstkleur, en elke vrije
      # tekstrol tegen elk oppervlak waar hij op kan landen. Superset — hij weet niet
      # welke combinaties de apps echt gebruiken, dus een treffer is altijd echt.
      - name: Guard — contrast van de rollaag (WCAG AA)
        id: guard-contrast-van-de-rollaag-wcag-aa
        run: pnpm --filter @umanex/tokens contrast

      # rowtrack-web draait op RowTrack's eigen rollaag. Tailwind slaat een onbekende
      # klasse in een className stil over, dus `border-border-defualt` rendert geen
      # fout maar Tailwinds eigen kleur — een waarde die uit geen enkel token komt.
      # Deze guard vangt dat; @apply deed het al, een className niet.
      - name: Guard — rol-utilities bestaan echt (rowtrack-web)
        id: guard-rol-utilities-bestaan-echt-rowtrack-web
        run: pnpm --filter @umanex/rowtrack-tokens guard

      # Twee tegenproeven, want een guard die draait is nog geen guard die meet.
      # De zelftest bewijst dat hij afgaat op het geval waarvoor hij gebouwd is; de
      # marge-meting bewijst dat zijn tikfout-drempel nog niet aan een echte
      # Tailwind-klasse raakt. Zakt die marge naar nul, dan gaat CI stuk vóór de
      # guard vals alarm begint te slaan.
      # Elke app declareert in zijn CLAUDE.md welke preset, welke componentbron en welke
      # Storybook hij gebruikt; deze guard toetst die declaratie tegen wat er op schijf staat.
      # De as die ertoe doet is [adoptie]: een workspace-dependency die geen enkel app-bestand
      # importeert leest als adoptie zonder het te zijn. Zo droeg cashflow @umanex/ui maanden
      # in package.json terwijl de enige importeur een render-script was.
      #
      # De tegenproef draait ernaast, want een guard die draait is nog geen guard die meet:
      # de eerste versie stond groen op precies die app, omdat next.config.mjs de package in
      # transpilePackages noemt en het meetbereik de app-root meenam.
      # PR-verwijzingen in de markdown: bestaan ze, en zeggen ze uit welke repo ze komen?
      # Een kaal #N in de gesynchroniseerde laag (.umanex-os/, .claude/skills/) reist mee
      # naar elke klant-repo en wijst daar naar een andere PR. Het bestáán kan de
      # pre-commit hook niet toetsen — die heeft geen netwerk en kan een echt nummer niet
      # van een plausibel nummer onderscheiden. Vandaar deze stap, met zijn zelftest.
      #
      # Wat hij NIET vangt: een nummer dat bestaat maar het verkeerde is. Daar helpt alleen
      # de volgorde — eerst de call, dan het nummer opschrijven. Zie .umanex-os/CLAUDE.md.
      - name: Guard — PR-verwijzingen gekwalificeerd en bestaand (met zelftest)
        id: guard-pr-verwijzingen-gekwalificeerd-en-bestaand-met-zelftes
        run: |
          node scripts/refs-check.mjs --selftest
          node scripts/refs-check.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard — design-systeem-bron per app (met tegenproef)
        id: guard-design-systeem-bron-per-app-met-tegenproef
        run: pnpm ds:guard:selftest

      - name: Guard — tegenproef op de rol-utility-guard
        id: guard-tegenproef-op-de-rol-utility-guard
        run: |
          pnpm --filter @umanex/rowtrack-tokens guard:selftest
          node packages/rowtrack-tokens/scripts/margin.mjs

      # De check hierboven kent alleen de tokens. Wat er in een component écht ontstaat —
      # tekst op een geneste achtergrond, een alpha-vlak boven een ander vlak — zag tot nu
      # toe alleen een mens in een browserconsole, met drie meetfouten onderweg. Deze sweep
      # meet dat op de gerenderde DOM van de harness: geen server, geen sessie, één
      # statisch bestand.
      - name: Cache Playwright-browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Playwright Chromium
        # De runner-image draagt een apt-bron voor Google Chrome die af en toe een "Hash Sum
        # mismatch" geeft (gemeten 2026-09-09: drie reruns op rij rood, terwijl dezelfde stap
        # een half uur eerder groen was). `--with-deps` draait apt-get update en valt daar
        # dan op om, terwijl Playwright zijn eigen Chromium downloadt en dl.google.com hier
        # niets bijdraagt. Dus: die bron weg vóór apt loopt — op inhoud, niet op bestandsnaam:
        # `google-chrome*.list` bestond niet op de runner (gemeten, 4b66544) en apt haalde
        # dl.google.com gewoon op; het bestand heet daar anders (deb822 `.sources`).
        run: |
          sudo grep -rl 'dl.google.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          if sudo grep -rl 'dl.google.com' /etc/apt/ >/dev/null 2>&1; then echo "let op: dl.google.com staat nog in /etc/apt"; sudo grep -rl 'dl.google.com' /etc/apt/; fi
          pnpm --filter cashflow exec playwright install --with-deps chromium

      # `verify:visual` rendert de harness uit de build hierboven en sweept hem daarna.
      # De sweep draait zijn eigen zelftest mee — een guard die niet kán falen meldt
      # "0 fouten" even overtuigend als een die werkt.
      # De sync-guard toetst namen, variant-assen, tokenwaarden en typografie-herkomst —
      # geen enkele van die assen raakt een MAAT. Deze stap meet de gerenderde doosmaten van
      # elke story tegen een gecommitteerde basislijn. Vereist de Storybook-build hierboven
      # en de Chromium uit de stap ervoor.
      - name: Guard — gerenderde maten van packages/ui tegen de basislijn
        id: guard-gerenderde-maten-van-packages-ui-tegen-de-basislijn
        run: pnpm --filter @umanex/ui geometry

      # De maat-as tussen Figma en de browser, per variant-node. De join zijn de 68
      # variant-nodes uit de schema-2-manifest; zonder die nodes bestond de koppeling niet.
      # Vergelijkt hoogte, horizontale padding, gap, radius, randbreedte, opacity en de
      # aanwezigheid van vulling/rand/effect. Breedte en verticale padding blijven er
      # bewust buiten — beide zijn niet vergelijkbaar tussen Figma en een browser.
      - name: Guard — Figma ↔ browser per variant (geometrie-parity)
        id: guard-figma-browser-per-variant-geometrie-parity
        run: pnpm --filter @umanex/ui parity

      - name: Guard — contrast van de gerenderde DOM (WCAG AA)
        id: guard-contrast-van-de-gerenderde-dom-wcag-aa
        run: pnpm --filter cashflow verify:visual

      # De rekenkern van cashflow rolt door: het eindsaldo van maand N is het beginsaldo van
      # N+1, en een pot draagt zijn stand mee. Een fout daar is per scherm onzichtbaar en
      # per keten fataal, dus de dekking zit in invarianten die over het hele model rekenen.
      # Twee suites, 594 checks; ze draaiden tot 2026-08-08 alleen met de hand.
      - name: Guard — invarianten op de rekenkern (buffer + anker)
        id: guard-invarianten-op-de-rekenkern-buffer-anker
        run: pnpm --filter cashflow scenarios

      # De sleep tussen twee maandkolommen is het enige pad dat noch de sweep noch de
      # scenario's raken: hij hangt aan dnd-kit én de store. De harness rijdt hem uit met
      # toetsenbord en muis tegen de build hierboven, en onderschept élk verzoek naar de
      # Supabase-origin — ook de wegschrijf-call, die geteld wordt in plaats van verstuurd.
      # `flow:ci` serveert de build van de stap hierboven (`--dist=.next`: alleen lezen,
      # nooit bouwen) en voegt de tegenproeven toe die hóren te falen. Lokaal bouwt de
      # harness zelf in `.next-harness`, zodat hij de `.next` van PM2 niet raakt.
      - name: Guard — flow (sleep tussen maandkolommen)
        id: guard-flow-sleep-tussen-maandkolommen
        run: pnpm --filter cashflow flow:ci
        env:
          # Dezelfde placeholder als de build. De harness leest hem om te weten welke origin
          # hij moet dichtzetten — zonder die waarde weigert hij te starten, en dat hoort zo.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # De leadscore van jobradar is een afgeleide van een afgeleide: hij volgt uit de
      # signalen, die volgen uit de design/dev-classificatie, die volgt uit de keyword-match.
      # Een fout onderin is per kaart onzichtbaar en over de hele feed structureel — dus
      # invarianten die over de dataset rekenen, geen verwachte uitkomst per geval. De suite
      # draait zijn eigen tegenproef vooraf en heeft netwerk noch database nodig.
      - name: Guard — invarianten op de scorekern (jobradar)
        id: guard-invarianten-op-de-scorekern-jobradar
        run: pnpm --filter jobradar scenarios

      # Storybook en het Figma-bestand "Component library" moeten één op één blijven:
      # elke component een eigen pagina, elke variant-as aan beide kanten hetzelfde,
      # elke tokenrol een variable, elke deep-link naar een bestaande node. De guard
      # leest de neergeslagen Figma-staat uit packages/ui/figma/manifest.json — CI heeft
      # geen Figma-toegang, dus dat bestand is de meting, niet de bron. Wat hij dus NIET
      # ziet: een wijziging in Figma zonder verse manifest (zie packages/ui/CLAUDE.md).
      #
      # De selftest draait ervóór: hij bouwt per as het defect dat de guard moet vangen
      # en eist dat hij erop afgaat, plus een ongewijzigde kopie die groen moet blijven.
      # Zonder die twee kanten weet je niet of de guard meet of alleen draait.
      - name: Guard — Storybook ↔ Figma in sync (met tegenproef)
        id: guard-storybook-figma-in-sync-met-tegenproef
        run: pnpm --filter @umanex/ui figma:check:selftest

      # --- rowtrack --------------------------------------------------------------------
      #
      # Deze zeven lezen UITSLUITEND gecommitte artefacten: figma/build-spec.min.json,
      # geometry.figma.json, geometry.schermen.json, manifest.json en laagnamen.json. Geen
      # Figma-toegang, geen browser, geen Storybook-build — samen onder de tien seconden
      # (gemeten 2026-09-09, zes ervan onder één seconde).
      #
      # Waarom ze hier pas komen: de hele meetketen — 13 guard-assen, recursieve parity over
      # 3 516 nodes, vijf tegenproeven — is deze week gebouwd en draaide tot vandaag alleen
      # wanneer iemand eraan dacht. Een guard die niemand aanroept, meet niets.
      #
      # Wat de selftest hier NIET kan: zijn producent-mutatie leunt op figma/build-spec.json
      # en dat bestand is gitignored (11 MB, herbouwbaar). Hij meldt die dan als
      # OVERGESLAGEN mét reden — nagemeten 2026-09-09 door het bestand weg te halen: exit 0,
      # 42 van 44 mutaties, en de twee producent-mutaties expliciet overgeslagen in plaats
      # van stil groen. Dat verschil is het punt: overgeslagen is geen ok.
      - name: Guard — rowtrack Figma ↔ code (met tegenproef)
        id: guard-rowtrack-figma-code-met-tegenproef
        run: |
          pnpm --filter rowtrack figma:check
          pnpm --filter rowtrack figma:check:selftest

      # Parity vergelijkt de gemeten browser-geometrie met de laatst gelezen Figma-staat, op
      # boompad, per node. De selftest ernaast toetst de MACHINERIE: hij synthetiseert een
      # Figma-kant uit de spec en eist rood op een wortel, een binnennode, een schermframe,
      # een extra wrapper en een verdwenen node — plus groen zonder mutatie.
      - name: Guard — rowtrack Figma ↔ browser (geometrie-parity, met tegenproef)
        id: guard-rowtrack-figma-browser-geometrie-parity-met-tegenproef
        run: |
          pnpm --filter rowtrack parity
          pnpm --filter rowtrack parity:selftest

      # Drie tegenproeven zonder eigen guard-stap: de builder-poort (weigert een gepubliceerde
      # of met de hand gewijzigde pagina te legen), de laagnaam-ladder (elk feit verslaat de
      # gok eronder) en spec-diff (de per-snede-poort die de gerenderde DOM tegen HEAD legt).
      - name: Guard — rowtrack tegenproeven (poort, laagnamen, spec-diff)
        id: guard-rowtrack-tegenproeven-poort-laagnamen-spec-diff
        run: |
          pnpm --filter rowtrack figma:poort:selftest
          pnpm --filter rowtrack laagnamen:selftest
          pnpm --filter rowtrack spec-diff:selftest

      # Welke tekst een instance in Figma TOONT — offline op de bouwspec, met een tweezijdige
      # ratel op "stil" (instance blijft staan en toont de library-data) en "terugval". Niets
      # anders ziet die eerste klasse: de builder meldt alleen een slot dat er is, parity ziet
      # gelijke geometrie, figma:check toetst de library en niet de vulling.
      # Een som en zijn teller horen per conventie bij elkaar, en die conventie is hier al
      # eens gebroken: op 2026-08-17 deelden vijf call-sites door `tickCount` in plaats van
      # door de teller die in dezelfde guard optelde, en het gemiddelde werd stelselmatig te
      # laag. Per scherm onzichtbaar — er stond gewoon een plausibel getal.
      #
      # De zelftest ernaast toetst BEIDE takken: een verkeerde noemer die er direct staat, en
      # een die achter een lokale hulpvariabele zit. Die tweede is niet overbodig — de eerste
      # versie van deze guard las alleen directe noemers en zou drie van de tien delingen
      # ongemeten hebben gelaten.
      - name: Guard — rowtrack gemiddelden delen door hun eigen teller (met tegenproef)
        id: guard-rowtrack-gemiddelden-eigen-teller-met-tegenproef
        run: |
          pnpm --filter rowtrack averages:selftest
          pnpm --filter rowtrack averages

      - name: Guard — rowtrack instance-voorvlucht (met tegenproef)
        id: guard-rowtrack-instance-voorvlucht-met-tegenproef
        run: |
          pnpm --filter rowtrack figma:instance-tekst
          pnpm --filter rowtrack figma:instance-tekst:selftest

      # --- rowtrack, de render-assen ----------------------------------------------------
      #
      # Deze drie leunen op de Storybook-build en op Chromium, dus ze staan ná beide. Ze zijn
      # duurder dan de zeven hierboven en meten iets anders: niet de gecommitte artefacten maar
      # wat er werkelijk rendert.

      # Een geslaagde `storybook build` is géén uitspraak over wat er rendert: gemeten
      # 2026-09-07 gaf de build exit 0 terwijl 26 van de 197 stories leeg renderden (de
      # worklet-transform ontbrak). Deze sweep telt console-fouten én lege renders.
      - name: Guard — rowtrack rendert al zijn stories (build-pad)
        id: guard-rowtrack-rendert-al-zijn-stories-build-pad
        run: pnpm --filter rowtrack render:sweep

      # En het build-pad is geen uitspraak over het DEV-pad. Twee assen lopen aantoonbaar
      # uiteen: `__DEV__` (bibliotheken doen dan zelfcontroles die de build nooit uitvoert) en
      # de dependency-optimizer, die alleen in dev bestaat. Gemeten 2026-09-08: 197/197 groen
      # terwijl `storybook dev` niet eens startte. Gemeten 2026-09-14: 257/257 groen terwijl
      # zes stories in dev leeg bleven, omdat de optimizer de échte expo-router pre-bundelde
      # en de mock daar niet vuurt.
      #
      # De dep-cache is in CI koud per constructie (verse node_modules), dus er valt hier niets
      # te wissen — een `rm -rf` op een pad dat niet bestaat geeft exit 0 en meet niets.
      - name: Guard — rowtrack rendert al zijn stories (dev-pad)
        id: guard-rowtrack-rendert-al-zijn-stories-dev-pad
        run: |
          set -uo pipefail
          pnpm --filter rowtrack storybook > /tmp/rowtrack-storybook-dev.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://localhost:6007/index.json >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -sf http://localhost:6007/index.json >/dev/null 2>&1; then
            echo "::error::storybook dev kwam niet op :6007 — de dev-as heeft dan niets gemeten, en dat is een fout en geen overslaan"
            tail -40 /tmp/rowtrack-storybook-dev.log
            exit 1
          fi
          out=$(pnpm --filter rowtrack dev-sweep 2>&1); rc=$?
          echo "$out"
          pkill -f 'storybook dev -p 6007' || true
          exit $rc

      # Wat de walker per constructie NIET meet, als getal in plaats van als vermoeden —
      # asymmetrische randkleur, placeholder zonder waarde, gescrolde containers, overloop
      # zonder clip, geneste inline tekst, center/right, en marge. Tweezijdige ratel op de
      # basislijn, mét de noemer (42 schermstories) erbij: valt er een story weg, dan dalen
      # alle tellers mee en dat leest als winst.
      #
      # De zelftest ernaast wekt elke as één keer op een synthetische pagina op en eist dat een
      # pagina zonder die vormen overal nul geeft. Twee assen staan op nul (`randkleur`,
      # `overloop`), en daar is een teller die niets meet niet te onderscheiden van een teller
      # die niets vindt.
      - name: Guard — rowtrack walker-blindvlekken (ratel, met tegenproef)
        id: guard-rowtrack-walker-blindvlekken-ratel-met-tegenproef
        run: |
          pnpm --filter rowtrack blindvlekken:selftest
          pnpm --filter rowtrack blindvlekken

      # De beeld-as: de gecommitte Figma-export naast een verse browser-render, gedift in
      # Chromium's canvas. Dit is de as die `parity` per constructie NIET heeft — kleurwaarde,
      # icoonvorm, `text-transform` en BREEDTE. Juist daar leefde de drift: gemeten 2026-09-09
      # stond elke formulier-instance 390 breed met inhoud van 224, met dertien guard-assen
      # groen en nul parity-verschillen.
      #
      # De ratel staat op `overig` (het grove verschil buiten de tekstgebieden), per frame,
      # tegen een basislijn die PER PLATFORM gemeten is: de getallen komen uit de fontrendering
      # van de machine die meet, dus de linux-sectie is op deze runner geschreven en niet op een
      # Mac. Eén frame staat bewust zonder ratel — zie het script.
      - name: Guard — rowtrack Figma ↔ browser (beeld, met tegenproef)
        id: guard-rowtrack-figma-browser-beeld-met-tegenproef
        run: |
          pnpm --filter rowtrack beeld:selftest
          pnpm --filter rowtrack beeld


      # Elke guard hierboven levert één bit (de exit-code) en een rijkdom aan tekst voor een
      # lezer. Die tekst stond tot 2026-09-14 alleen in de log: 28 benoemde stappen, nul
      # samenvattingen. Deze stap zet de uitkomst per metende stap op de run-pagina — daar
      # waar iemand al kijkt — inclusief de noemer, zodat "alles groen" niet leest als succes
      # wanneer de lijst leeg zou zijn. `if: always()`, want juist een rode run wil je lezen.
      - name: Samenvatting — uitkomst per guard
        if: always()
        env:
          STAPPEN: ${{ toJSON(steps) }}
        run: |
          set -uo pipefail
          python3 - <<'PYEOF' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          import json, os
          stappen = json.loads(os.environ.get("STAPPEN") or "{}")
          teken = {"success": "OK", "failure": "GEFAALD", "cancelled": "AFGEBROKEN", "skipped": "OVERGESLAGEN"}
          # Het label komt uit het id, niet uit een tweede lijst met namen: een aparte
          # namen-map is een kopie die bij elke hernoeming stil uit de pas loopt.
          rijen = [(sid, (v or {}).get("outcome", "?")) for sid, v in sorted(stappen.items())]
          groen = sum(1 for _, o in rijen if o == "success")
          print("### Guards")
          print()
          if not rijen:
              print("_Geen enkele stap droeg een id — deze samenvatting meet niets._")
          else:
              print("**%d van %d geslaagd**" % (groen, len(rijen)))
              print()
              print("| stap | uitkomst |")
              print("|---|---|")
              for sid, o in rijen:
                  label = sid.replace("-", " ")
                  print("| %s | %s |" % (label, teken.get(o, o)))
          PYEOF
