name: Sync umanex-os layer

# Ontvangt een repository_dispatch vanuit umanex-os wanneer de globale CLAUDE.md,
# een profile, het sync-script of een staging-template wijzigt, en opent een PR met
# de bijgewerkte umanex-os-laag. Alle inhoud komt mee in de payload, zodat deze repo
# geen leestoegang tot de private umanex-os repo nodig heeft.
#
# Wat deze workflow schrijft:
#   - .umanex-os/CLAUDE.md, .umanex-os/profiles/<profile>.md   globale laag
#   - .umanex-os/profile                                        marker voor scripts/sync-os.sh
#   - scripts/sync-os.sh                                        canoniek sync-script
#   - scripts/gen-snapshot.sh, .githooks/pre-commit             snapshot-systeem (bestanden)
#   - .githooks/commit-msg                                      commit-scope guard (bestand)
#   - context.json                                              snapshot-input, seed-if-absent
#   - LEARNINGS.md in root + elke apps/*                        capture-staging, seed-if-absent
#   - HANDOFF.md in root + elke apps/*                          sessie-handoff, seed-if-absent
#   - BACKLOG.md in root + elke apps/*                          gemeld-niet-gebouwd, seed-if-absent
#
# PAYLOAD. De dispatcher stuurt één `bundle_b64` (tar.gz met alle canonieke bestanden)
# plus `profile_name` en `bundle_version` — drie van de tien velden die GitHub toestaat,
# dus het aantal bestanden is geen limiet meer. De oude vorm (elk bestand een eigen veld)
# werd hier nog als fallback gelezen; die tak is verwijderd nadat alle klant-repos de
# bundel-versie draaiden. Dode code in een receiver is duur: hij propageert naar drie
# repo's en suggereert een pad dat allang niet meer bestaat.
#
# Skills worden NIET via CI gesynct: die staan user-level (~/.claude/skills) en komen
# via het lokale scripts/sync-os.sh. GitHub Actions kan niet naar de runner-home schrijven.
#
# De hook-ACTIVATIE (git config core.hooksPath .githooks) zet CI NIET — dat is lokale
# git-config van je werkkopie. Draai één keer scripts/sync-os.sh lokaal.
#
# Deze workflow kan zichzelf niet updaten — GitHub weigert workflow-wijzigingen met de
# default GITHUB_TOKEN. Nieuwe versies van deze receiver gaan via een handmatige PR.
#
# Canonieke bron: umanex-os/templates/umanex-os-sync.yml — wijzig daar, niet hier.

# Alleen repository_dispatch. `workflow_dispatch` stond hier ook, maar de job is gegate op
# `github.event_name == 'repository_dispatch'` en werd dus altijd overgeslagen — mét een
# groene conclusie, wat de indruk wekt dat een handmatige re-sync gewerkt heeft. Er is ook
# niets zinnigs handmatig te draaien: zonder payload is er geen laag om te installeren.
# Wil je opnieuw syncen, draai dan de dispatcher in umanex-os.
on:
  repository_dispatch:
    types: [umanex-os-sync]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Volledige historie. De default is depth 1, en dan heeft `git merge origin/main`
          # verderop geen gemeenschappelijke voorouder in de lokale objecten: git meldt
          # "refusing to merge unrelated histories" terwijl de branches op GitHub wél een
          # merge-base delen. Dat bijt pas wanneer de sync-branch al bestaat én main intussen
          # doorgelopen is — dus precies in de drukste repo, en nooit in een rustige test.
          # Een vaste diepte lost het niet op: de divergentie kan altijd groter zijn.
          fetch-depth: 0

      - name: Schrijf umanex-os laag uit payload en open PR
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_NAME: ${{ github.event.client_payload.profile_name }}
          BUNDLE_B64: ${{ github.event.client_payload.bundle_b64 }}
          BUNDLE_VERSION: ${{ github.event.client_payload.bundle_version }}
        run: |
          set -euo pipefail

          # PROFILE_NAME wordt hieronder als padcomponent gebruikt. Zonder deze toets zou een
          # payload met `../` buiten `.umanex-os/` schrijven, en `git add -A` commit dat mee.
          # De dispatcher stuurt altijd een simpele klantnaam; de guard kost niets en sluit
          # de enige plek af waar payload-inhoud een pad bepaalt.
          case "${PROFILE_NAME:-}" in
            "" ) echo "✗ Payload zonder profile_name — afgebroken."; exit 1 ;;
            *[!a-zA-Z0-9_-]* ) echo "✗ profile_name '$PROFILE_NAME' bevat iets anders dan letters, cijfers, - of _ — afgebroken."; exit 1 ;;
          esac

          SRC="$(mktemp -d)"

          [ -n "${BUNDLE_B64:-}" ] || { echo "✗ Payload zonder bundle_b64 — afgebroken."; exit 1; }

          # Onbekende bundelversie = hard falen. Stil de verkeerde bestanden wegschrijven
          # is precies de faalvorm die de receiver-drift ooit onzichtbaar hield.
          case "${BUNDLE_VERSION:-1}" in
            1) : ;;
            *) echo "Bundelversie '${BUNDLE_VERSION}' is nieuwer dan deze receiver kent. Werk de receiver bij via een handmatige PR."; exit 1 ;;
          esac
          printf '%s' "$BUNDLE_B64" | base64 -d | tar -xzf - -C "$SRC" --strip-components=1
          echo "Payload: bundel v${BUNDLE_VERSION:-1}"

          # ── Eerst de doelbranch, dán installeren. Die volgorde is het hele punt. ──
          #
          # Voorheen installeerde deze workflow op een verse main, vertakte daarna, en deed
          # `push -f`. Had je op de open sync-PR een fixup gepusht — een geseede LEARNINGS.md
          # bijgesteld, een conflict opgelost — dan verving de volgende sync die historie door
          # één verse commit, met de melding "Bestaande open PR bijgewerkt via push" eronder.
          #
          # Door eerst naar de bestaande branch te gaan en dáár overheen te installeren,
          # worden de canonieke bestanden gewoon overschreven (dat hóórt) terwijl alles wat
          # jij op de PR veranderde blijft staan. `merge origin/main` erbij zodat de PR geen
          # nieuwere main-content terugdraait. Geen `-f` meer bij de push: een niet-fast-
          # forward faalt dan luid in plaats van stil te wissen.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/sync-umanex-os"
          git fetch -q origin "$BRANCH" 2>/dev/null || true

          if git rev-parse --verify -q "refs/remotes/origin/$BRANCH" >/dev/null 2>&1; then
            echo "Bestaande sync-branch gevonden — daarop voortbouwen."
            git switch -q -c "$BRANCH" "origin/$BRANCH"
            if ! git merge -q --no-edit origin/main; then
              echo "✗ Kon origin/main niet in $BRANCH mergen — er staat een conflict op de PR."
              echo "  Los dat met de hand op; deze sync stopt om niets te overschrijven."
              exit 1
            fi
          else
            git switch -q -c "$BRANCH"
          fi

          # ── Installeren. Vanaf hier is de payload-vorm niet meer zichtbaar. ──

          # Een ontbrekend bundel-lid faalt luid, precies zoals een onbekende bundle_version.
          #
          # Voorheen gaf `[ -f "$SRC/$1" ] || return 0` succes terug bij een ontbrekende bron,
          # waardoor een afgekapte tar of een vergeten `cp` in de dispatcher een hálve laag
          # installeerde, committe en als schone sync rapporteerde. De klant-repo eindigde
          # dan met een verse CLAUDE.md naast een maanden oude commit-msg-guard, en élk
          # downstream-signaal stond groen — dezelfde onzichtbare partiële sync die de
          # receiver-drift bij umanex-apps zo lang verborgen hield.
          install_file() { # $1=bron in SRC  $2=doelpad  $3=executable? (x|"")
            if [ ! -f "$SRC/$1" ]; then
              echo "✗ Bundel mist '$1' — de payload is onvolledig. Niets geïnstalleerd."
              echo "  Controleer de dispatcher: elk canoniek bestand hoort in \$work/bundle."
              exit 1
            fi
            mkdir -p "$(dirname "$2")"
            cp "$SRC/$1" "$2"
            [ "${3:-}" = "x" ] && chmod +x "$2" || true
          }

          install_file CLAUDE.md           ".umanex-os/CLAUDE.md"
          install_file profile.md          ".umanex-os/profiles/${PROFILE_NAME}.md"
          install_file sync-os.sh          "scripts/sync-os.sh"          x
          install_file gen-snapshot.sh     "scripts/gen-snapshot.sh"     x
          install_file githooks-pre-commit ".githooks/pre-commit"        x
          install_file githooks-commit-msg ".githooks/commit-msg"        x

          # Marker voor het lokale scripts/sync-os.sh
          printf '%s\n' "$PROFILE_NAME" > .umanex-os/profile

          # context.json is repo-eigen input → alleen scaffolden als afwezig.
          [ -f context.json ] || install_file context.json.template "context.json"

          # Staging-seeds in root + elke app — alleen als afwezig, nooit overschrijven.
          # LEARNINGS is terugkijkend (waargenomen fouten), HANDOFF vooruitkijkend en
          # sessie-gebonden, BACKLOG duurzaam (benoemd maar niet gebouwd). Alle drie worden
          # bij sessiestart uitgelezen door session-start-handoff.sh, dus een ontbrekend
          # bestand maakt de bijbehorende lus stil in plaats van luidruchtig.
          seed_layered() { # $1=bron in SRC  $2=bestandsnaam in de repo
            [ -f "$SRC/$1" ] || return 0
            local d
            [ -f "./$2" ] || cp "$SRC/$1" "./$2"
            if [ -d apps ]; then
              for d in apps/*/; do
                [ -d "$d" ] && { [ -f "${d%/}/$2" ] || cp "$SRC/$1" "${d%/}/$2"; }
              done
            fi
          }
          seed_layered LEARNINGS.template.md LEARNINGS.md
          seed_layered HANDOFF.template.md   HANDOFF.md
          seed_layered BACKLOG.template.md   BACKLOG.md

          rm -rf "$SRC"

          # ── De laag valideren vóór hij een PR wordt. ──
          #
          # Op deze PR draait géén CI van deze repo, en dat is geen instelling maar een
          # ontwerpkeuze van GitHub: een push met de default `github.token` triggert bewust
          # geen workflows, anders krijg je oneindige lussen. Gevolg is wel dat een sync-PR
          # nul checks toont — visueel niet te onderscheiden van "alles groen".
          #
          # Een PAT per klant-repo zou dat oplossen, maar dat is een secret met schrijfrechten
          # erbij voor een controle die niets over de app zegt (er komt geen app-code in deze
          # PR). Dus valideren we hier, waar de bestanden al staan en een fout de sync nog
          # kan tegenhouden in plaats van hem als PR door te laten.
          echo "→ Laag valideren"
          layer_ok=1
          for f in scripts/sync-os.sh scripts/gen-snapshot.sh .githooks/pre-commit .githooks/commit-msg; do
            [ -f "$f" ] || { echo "  ✗ $f ontbreekt na installatie"; layer_ok=0; continue; }
            [ -s "$f" ] || { echo "  ✗ $f is leeg"; layer_ok=0; continue; }
            bash -n "$f" 2>/dev/null || { echo "  ✗ $f is geen geldige bash"; layer_ok=0; continue; }
            [ -x "$f" ] || { echo "  ✗ $f is niet executable — git zou de hook stil overslaan"; layer_ok=0; continue; }
            echo "  ✓ $f"
          done
          # context.json is repo-eigen input (seed-if-absent), geen canoniek bestand. Een
          # klant die hem met de hand kapotmaakt is een echt probleem, maar niet dít
          # probleem — de sync tegenhouden lost daar niets aan op en blokkeert wél de
          # levering van alles wat wél klopt. Dus melden, niet falen: fail op wat je
          # installeert, waarschuw over wat je alleen aantreft.
          if [ -f context.json ] && ! python3 -c 'import json; json.load(open("context.json"))' 2>/dev/null; then
            echo "  ⚠ context.json is geen geldige JSON — snapshots krijgen [TODO]-placeholders"
            echo "    (repo-eigen bestand, dus dit houdt de sync niet tegen)"
          fi
          if [ "$layer_ok" -ne 1 ]; then
            echo ""
            echo "✗ De gesyncte laag is kapot — geen PR geopend."
            echo "  Fix het canonieke bestand in umanex-os en dispatch opnieuw."
            exit 1
          fi

          # Drift-check: alles stagen en kijken of er iets veranderde t.o.v. de doelbranch.
          git add -A
          if git diff --cached --quiet; then
            echo "Geen drift — umanex-os laag is al up-to-date."
            exit 0
          fi

          git commit -m "chore: sync umanex-os layer with global umanex-os"
          git push origin "$BRANCH"

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "Bestaande open PR aangevuld met een nieuwe commit (bestaande commits blijven staan)."
          else
            PR_BODY="Automatische sync van de umanex-os laag (CLAUDE.md, profile, marker, sync-script, git hooks, LEARNINGS-, HANDOFF- en BACKLOG-seed), getriggerd door een wijziging in umanex-os. Skills komen via het lokale scripts/sync-os.sh.

            **Geen checks op deze PR, en dat is verwacht.** GitHub triggert geen workflows voor een push met de default github.token. De laag is daarom in de sync-job zelf gevalideerd: elk gesynct shell-bestand is niet-leeg, syntactisch geldig en executable, en context.json is geldige JSON. Was dat niet zo, dan was deze PR niet geopend.

            Review en merge wanneer je wil."
            gh pr create --base main --head "$BRANCH" \
              --title "chore: sync umanex-os layer with global umanex-os" \
              --body "$PR_BODY"
          fi
