name: Tokens sync

# Houdt de gegenereerde design-token-code in sync met Tokens Studio.
# Tokens Studio pusht een bijgewerkte tokens.json naar main; deze workflow
# herbouwt de outputs en commit ze automatisch terug, zodat code == Figma.
#
# Twee onafhankelijke token-BRONNEN, met drie outputs — RowTrack's bron voedt er twee:
#   - RowTrack (RN)  : apps/rowtrack/tokens/tokens.json → apps/rowtrack/constants/*.ts
#   - RowTrack (web) : apps/rowtrack/tokens/tokens.json → packages/rowtrack-tokens/build/*
#   - umanex (web)   : packages/tokens/tokens.json      → packages/tokens/build/*
#
# Beide builds zijn deterministisch/idempotent — altijd allebei draaien is veilig;
# git commit enkel de echte diffs. De paths-filter zorgt dat de workflow alleen
# vuurt bij een tokens.json-wijziging (de teruggecommitte outputs raken tokens.json
# niet → geen loop). GITHUB_TOKEN-pushes triggeren zelf geen workflows.

on:
  push:
    branches: [main]
    paths:
      - "apps/rowtrack/tokens/tokens.json"
      - "packages/tokens/tokens.json"
      # Ook op de generator zelf: een wijziging in build.mjs of de transforms
      # verandert de output net zo goed als een tokenwijziging. Zonder deze
      # paths bleef de gecommitte output dan stale tot de volgende Figma-push.
      - "packages/tokens/build.mjs"
      - "packages/tokens/lib/**"
      - "packages/rowtrack-tokens/build.mjs"
      - "packages/rowtrack-tokens/lib/**"
      - "packages/rowtrack-tokens/tailwind/**"
  workflow_dispatch: {} # handmatige her-sync

permissions:
  contents: write

concurrency:
  group: tokens-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Rebuild + commit generated tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild RowTrack tokens (style-dictionary → constants)
        run: pnpm --filter rowtrack tokens:build

      - name: Rebuild RowTrack web tokens (@umanex/rowtrack-tokens → build/)
        run: pnpm --filter @umanex/rowtrack-tokens build

      - name: Rebuild umanex web tokens (@umanex/tokens → build/)
        run: pnpm --filter @umanex/tokens build

      - name: Guard — geen DTCG $value-uitval of onopgeloste alias in de output
        run: |
          # `: undefined` / `[object Object]` = de DTCG $value-valkuil.
          # `{Foo.bar}` = een alias die nooit geresolved is. Die derde vorm ontbrak,
          # waardoor precies de faalmodus van een set-hernoeming door de guard glipte.
          #
          # Scope = de GELEVERDE output. Niet de hele build-map: build/_merged.json is
          # het tussenbestand dat Style Dictionary als input krijgt en dat per definitie
          # nog onopgeloste aliassen bevat.
          HITS="$(grep -rnE ': undefined|\[object Object\]|\{[A-Za-z][A-Za-z0-9_.-]*\}' \
            apps/rowtrack/constants packages/tokens/build/*.css \
            packages/rowtrack-tokens/build/*.css 2>/dev/null || true)"
          if [ -n "$HITS" ]; then
            echo "::error::Token-build produceerde undefined / [object Object] / een onopgeloste alias. Niet gecommit."
            echo "$HITS"
            exit 1
          fi

      - name: Guard — outputs zijn niet leeggelopen
        run: |
          # Een filter dat te veel wegneemt geeft een syntactisch geldig maar leeg
          # bestand. Zonder ondergrens is dat niet te onderscheiden van succes.
          check() {
            COUNT="$(grep -cE '^\s*--' "$1" || true)"
            if [ "$COUNT" -lt "$2" ]; then
              echo "::error::$1 heeft $COUNT custom properties, verwacht minstens $2."
              exit 1
            fi
            echo "$1: $COUNT custom properties ✓"
          }
          check packages/tokens/build/theme.css 60
          # RowTrack's Theme-set levert 33 rollen; 25 is de vloer die build.mjs zelf
          # ook hanteert. Loopt hij daaronder, dan is de bron leeg of verkeerd
          # geclassificeerd — geen geslaagde build.
          check packages/rowtrack-tokens/build/theme.css 25

      - name: Type-check RowTrack (valideert dat de constants compileren)
        run: pnpm --filter rowtrack exec tsc --noEmit

      # De web-preset is de enige consument die op de ROLNAMEN staat: hij gooit
      # wanneer een rol bij geen enkele COLOR_GROUP hoort. Die throw vuurt pas als
      # Tailwind de config laadt, dus tsc ziet hem niet — alleen een echte build wel.
      #
      # Dat is hier geen luxe: deze workflow pusht met GITHUB_TOKEN en die push
      # triggert per ontwerp geen workflows. Zonder deze stap zou een hernoemde rol
      # de site stukmaken op main zónder dat één check afgaat.
      - name: Build rowtrack-web (valideert dat de rollen door de preset komen)
        run: pnpm turbo build --filter rowtrack-web

      - name: Commit gegenereerde output terug naar main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rowtrack/constants packages/tokens/build packages/rowtrack-tokens/build
          if git diff --cached --quiet; then
            echo "Geen gegenereerde wijzigingen — code al in sync met de tokens."
            exit 0
          fi
          git commit -m "chore(tokens): sync generated tokens from Tokens Studio"
          git push
